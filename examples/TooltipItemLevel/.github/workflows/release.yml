name: Package and release

# Push a vX.Y.Z tag to package with the BigWigs packager and upload to CurseForge, Wago and GitHub Releases.
# The game type is detected from "## Interface: 16xxx" (forever). Uploads whose token is unset are skipped.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
